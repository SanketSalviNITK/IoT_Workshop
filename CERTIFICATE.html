<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE LAST BEACON | Certificate</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { background: #050505; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #00ffcc; font-family: 'Rajdhani', sans-serif; }
        #certificate {
            width: 800px;
            height: 500px;
            border: 5px double #00ffcc;
            padding: 40px;
            text-align: center;
            background: rgba(10, 25, 47, 0.9);
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.3);
            position: relative;
            overflow: hidden;
        }
        #certificate::before {
            content: "CERTIFIED";
            position: absolute;
            top: -20px;
            right: -50px;
            background: #00ffcc;
            color: #050505;
            padding: 40px 100px;
            transform: rotate(45deg);
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
        }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 3rem; margin-top: 60px; letter-spacing: 5px; text-shadow: 0 0 20px #00ffcc; }
        .subtitle { font-size: 1.5rem; text-transform: uppercase; margin-bottom: 40px; color: #0066ff; }
        .name-line { border-bottom: 2px solid #00ffcc; width: 60%; margin: 20px auto; font-size: 2.5rem; padding: 10px; font-weight: bold; }
        .footer { margin-top: 50px; display: flex; justify-content: space-around; font-size: 0.9rem; }
        .sign { border-top: 1px solid #00ffcc; padding-top: 5px; width: 200px; }
    </style>
</head>
<body>
    <div id="certificate">
        <p class="subtitle">This is to certify that</p>
        <div class="name-line" contenteditable="true">ENTER ENGINEER NAME</div>
        <h1>BEACON ENGINEER</h1>
        <p>Has successfully restored the communication relay station on the Island of Dharani and transmitted the Last Beacon signal.</p>
        
        <div class="footer">
            <div class="sign">
                <strong>A.R.I.A.</strong><br>
                System Intelligence
            </div>
            <div class="sign">
                <strong>Dr. Sanket Salvi</strong><br>
                Assistant Professor, MIT-WPU
            </div>
        </div>
    </div>
</body>
</html>
